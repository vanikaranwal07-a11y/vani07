```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Website</title>

    <!-- Link CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Section -->
    <main>
        <h1>Welcome to My Website ✨</h1>

        <p class="subtitle">
            Creativity begins with a single line of code.
        </p>

        <!-- Animated Card -->
        <div class="card">
            <h2>Explore Something New</h2>

            <p class="float">
                Design • Create • Innovate
            </p>

            <button onclick="showMessage()">
                Explore More
            </button>
        </div>
    </main>

    <!-- JavaScript for button -->
    <script>
        function showMessage() {
            alert("Thanks for exploring my website! 🚀");
        }
    </script>

</body>
</html>
```
