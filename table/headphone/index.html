<!DOCTYPE html>
<html>
<head>
    <title>Wireless Headphones</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #f5f5f5;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .product-card {
            width: 360px;
            background: white;
            border-radius: 14px;
            padding: 14px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        .product-image-container {
            height: 280px;
            background: #f5f5f5;
            border-radius: 10px;

            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge {
            position: absolute;
            top: 12px;
            left: 12px;

            background: #ff6b35;
            color: white;

            padding: 6px 10px;
            border-radius: 5px;

            font-size: 12px;
            font-weight: bold;

            z-index: 2;
        }

        .product-info {
            padding: 15px 5px 5px;
        }

        .product-info h2 {
            font-size: 21px;
            color: #222;
            margin-bottom: 8px;
        }

        .rating {
            display: flex;
            align-items: center;
            gap: 6px;

            margin-bottom: 12px;

            font-size: 13px;
        }


        .reviews {
            color: #888;
        }

        .product-info p {
            color: #777;
            font-size: 14px;
            line-height: 1.5;

            margin-bottom: 16px;
        }
    </style>
</head>

<body>

    <div class="product-card">

        <div class="product-image-container">

        

            <img
                src="https://img.freepik.com/premium-photo/wireless-headphones-custom-design_985323-2167.jpg"
                alt="Wireless Headphones"
                class="product-image"
            >

        </div>

        <div class="product-info">

            <h2>Wireless Headphones</h2>

            

            <p>
                Premium wireless headphones with clear sound,
                long battery life and comfortable design.
            </p>

            

        </div>

    </div>

</body>
</html>
